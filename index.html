<script>
    // पूरा JavaScript कोड एक 'DOMContentLoaded' इवेंट के अंदर रैप किया गया है
    document.addEventListener('DOMContentLoaded', (event) => {
        
        // पूरा JavaScript लॉजिक अब try...catch के अंदर है
        try {
            const numbers = [
              "917676008010","919579153966","917503501495","918650862577","919828456573",
              "919393810441","919704077761","918080435420","917601979933","918605272036",
              "917043685709","919366262776","916352403917","919226415780","918729863414",
              "919704077761","917428449296","917015833030","919608878848","919927387487",
              "919924478339","916299356293","918305593822","919068654827","918904198066",
              "917208183530","918171221240","917050500262","916299782061","919785856130",
              "916002829539","916001007365","917631611426","919395674709","917042801764",
              "917896033308","919366262990","919259696225","917906698742","918738008119",
              "916009688635","919090593376","916003613262","918291912350","916002839172",
              "916003110893","919366558847","919365537928","919993096360","919473952265",
            ];

            const TELEGRAM_URL = "https://t.me/comingloots";
            const THRESHOLD = 5; 
            const MAX_NUMBERS = 10; 

            let clickCount = parseInt(localStorage.getItem('linkClicks')) || 0;
            let telegramRedirectCount = parseInt(localStorage.getItem('tgRedirects')) || 0;
            let totalNumbersShown = parseInt(localStorage.getItem('totalNumbersShown')) || 0;

            
            function showLimitExpired() {
                document.body.innerHTML = `
                    <div style="text-align: center; padding: 50px; font-family: Arial, sans-serif;">
                        <h1 style="color: red; font-size: 2em;">Today Agent Link Limit is Expired! 🚫</h1>
                        <p style="font-size: 1.2em; margin-top: 20px;">For more expensive offers & loots, please join our channel:</p>
                        <a href="${TELEGRAM_URL}" target="_blank" style="display: inline-block; padding: 10px 20px; background-color: #0088CC; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 20px; font-size: 1.1em;">
                            JOIN TELEGRAM CHANNEL NOW
                        </a>
                    </div>
                `;
            }
            
            // 1. सबसे पहले चेक करें: क्या लिमिट पहले ही पूरी हो चुकी है?
            if (totalNumbersShown >= MAX_NUMBERS) {
                showLimitExpired();
                return; 
            }
            
            // 2. लिमिट पूरी नहीं हुई: क्लिक काउंट बढ़ाएँ
            clickCount++;
            localStorage.setItem('linkClicks', clickCount);

            // 3. Telegram रीडायरेक्ट की बारी है?
            if (clickCount >= THRESHOLD) {
                
                telegramRedirectCount++;
                localStorage.setItem('tgRedirects', telegramRedirectCount);

                let warningMessage = "";
                let followUpMessage = "";

                if (telegramRedirectCount === 1) {
                    warningMessage = "चेतावनी (1/3): Telegram चैनल **ज्वाइन करें**। [ओके] दबाएँ।";
                    followUpMessage = "अगला WhatsApp नंबर पाने के लिए, Telegram चैनल ज्वाइन करने के बाद इस पेज पर **वापस आएँ**।";
                    
                } else if (telegramRedirectCount === 2) {
                    warningMessage = "चेतावनी (2/3): फिर से **ध्यान दें**! कृपया चैनल **ज्वाइन कर लें**। [ओके] दबाएँ।";
                    followUpMessage = "यह अंतिम स्टेप है। अगला नंबर पाने के लिए वापस आएँ।";
                    
                } else {
                    warningMessage = "✅ Verification Done ✅: अब आपको आगे भी नंबर्स मिलते रहेंगे।";
                    followUpMessage = "✅ वेरिफिकेशन पूरा हुआ। अब आपको आगे भी नंबर्स मिलते रहेंगे।";
                    
                    localStorage.setItem('linkClicks', 0); 
                    localStorage.setItem('tgRedirects', 0);
                }
                
                // **पहला अलर्ट**
                alert(warningMessage);

                // **दूसरा अलर्ट और रीडायरेक्ट**
                setTimeout(() => {
                    alert(followUpMessage);
                    window.location.replace(TELEGRAM_URL);
                }, 100); 
                
            } else {
                // 4. WhatsApp नंबर देने की बारी है 
                
                totalNumbersShown++;
                localStorage.setItem('totalNumbersShown', totalNumbersShown);
                
                // 5. जाँच करें: क्या यह 10वाँ नंबर है? 
                if (totalNumbersShown >= MAX_NUMBERS) {
                    
                    showLimitExpired();
                    return; // WhatsApp रीडायरेक्ट रोकें
                }

                // 6. WhatsApp पर रीडायरेक्ट करें
                const pick = numbers[Math.floor(Math.random() * numbers.length)];
                window.location.replace("https://wa.me/" + pick);
            }

        // यह 'catch' ब्लॉक सुनिश्चित करता है कि अगर कोई त्रुटि आती है तो भी पेज खाली न दिखे
        } catch(e) {
            document.body.innerHTML = '<div id="error-message" style="color: red; text-align: center; padding: 50px;">Error: Please refresh or try again later.</div>';
            console.error("Script Failed:", e);
        }
        
    }); // DOMContentLoaded end

</script>
